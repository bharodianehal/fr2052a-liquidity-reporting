# Databricks Asset Bundle - the FR 2052a Databricks App and its serving assets: the Genie space (resources/genie_space.yml,
# generated by deploy/genie_space.py), the Vector Search index, the agents' serving endpoint and its Lakebase role
# (resources/agents.yml). Deploy it after the platform bundle (../databricks.yml), the first build (job fr2052a-pipeline) and the
# first registration of the agents (job fr2052a-register-agents): each of these assets needs data or a model the build creates.
# The jobs and dashboards of the platform bundle are looked up by name.
# Variable values per target are in the gitignored .databricks/bundle/<target>/variable-overrides.json (see the example file).
#
#   cd app/frontend && npm run build && cd ..        # only after a frontend change: rebuilds static/ (versioned), deployed with the app
#   databricks bundle deploy -t dev -p <profile> && databricks bundle run fr2052a -t dev -p <profile>
bundle:
  name: fr2052a-app

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog of the build
  warehouse_id:
    description: SQL warehouse
  lakebase_database_id:
    description: Id of the Lakebase database fr2052a (the same value as in the platform bundle)
    default: fr2052a
  workspace_host:
    description: "Workspace URL (https://...) - the agents' serving endpoint signs in to it as fr2052a-agents (the CLI profile's host is not visible to the bundle)"
  lakebase_host:
    description: "Host of the Lakebase endpoint (databricks postgres get-endpoint projects/fr2052a/branches/production/endpoints/primary)"
  agents_sp_client_id:
    description: The agents' service principal fr2052a-agents (client id, printed by job fr2052a-register-agents)
  agents_lakebase_role_id:
    description: Id of its Lakebase role (a new workspace can keep the default)
    default: fr2052a-agents
  agents_model_version:
    description: Version of <catalog>.ai_assist.fr2052a_agents the serving endpoint serves - the champion (set it after each promotion)
  reporting_start:
    description: First reporting date the app shows
    default: "2026-02-23"
  ai_model:
    description: Foundation Model endpoint for interactive AI (Ask, LCR why, disclosure drafts)
    default: databricks-claude-sonnet-4-6
  agents_endpoint:
    description: Name of the agents' serving endpoint (resources/agents.yml)
    default: fr2052a-agents
  daily_job_id:
    lookup:
      job: fr2052a-daily
  revalidate_job_id:
    lookup:
      job: fr2052a-revalidate
  generate_job_id:
    lookup:
      job: fr2052a-generate
  demo_reset_job_id:
    lookup:
      job: fr2052a-demo-reset
  dashboard_id:
    description: AI/BI dashboard "FR 2052a Liquidity Reporting" of the platform bundle (databricks bundle summary; the dashboard lookup does not find it by name)
  lcr_dashboard_id:
    description: AI/BI dashboard "FR 2052a LCR" of the platform bundle

sync:
  include:
    - static/**               # the built frontend (versioned, so a clone deploys without a Node build)
  exclude:
    - frontend/**
    - resources/**             # bundle resources, not app source

resources:
  apps:
    fr2052a:
      name: fr2052a
      description: FR 2052a liquidity reporting and LCR - AI agents prepare, people check and release
      source_code_path: .
      config:
        command: [uvicorn, app:app, --host, 0.0.0.0, --port, "8000"]
        env:
          # PGHOST / PGPORT / PGDATABASE / PGUSER come from the fr2052a-lakebase resource
          - {name: DATABRICKS_WAREHOUSE_ID, value_from: sql-warehouse}
          - {name: CATALOG, value: "${var.catalog}"}
          - {name: REPORTING_START, value: "${var.reporting_start}"}
          - {name: LAKEBASE_ENDPOINT, value: projects/fr2052a/branches/production/endpoints/primary}
          - {name: LAKEBASE_DB, value: fr2052a}
          - {name: GENIE_SPACE_ID, value_from: genie-space}
          - {name: DAILY_JOB_ID, value_from: daily-job}
          - {name: REVALIDATE_JOB_ID, value_from: revalidate-job}
          - {name: GENERATE_JOB_ID, value_from: generate-job}
          - {name: DEMO_RESET_JOB_ID, value_from: demo-reset-job}
          - {name: DASHBOARD_ID, value: "${var.dashboard_id}"}
          - {name: LCR_DASHBOARD_ID, value: "${var.lcr_dashboard_id}"}
          - {name: AI_MODEL, value: "${var.ai_model}"}
          - {name: AGENTS_ENDPOINT, value: "${var.agents_endpoint}"}
      resources:
        - {name: sql-warehouse, sql_warehouse: {id: "${var.warehouse_id}", permission: CAN_USE}}
        - name: fr2052a-lakebase
          postgres: {branch: projects/fr2052a/branches/production, database: "projects/fr2052a/branches/production/databases/${var.lakebase_database_id}", permission: CAN_CONNECT_AND_CREATE}
        - {name: genie-space, genie_space: {name: FR 2052a Liquidity Risk Genie, space_id: "${resources.genie_spaces.fr2052a_genie.id}", permission: CAN_RUN}}
        - {name: daily-job, job: {id: "${var.daily_job_id}", permission: CAN_MANAGE_RUN}}
        - {name: revalidate-job, job: {id: "${var.revalidate_job_id}", permission: CAN_MANAGE_RUN}}
        - {name: generate-job, job: {id: "${var.generate_job_id}", permission: CAN_MANAGE_RUN}}
        - {name: demo-reset-job, description: "Demo environment only: reset the demo dates", job: {id: "${var.demo_reset_job_id}", permission: CAN_MANAGE_RUN}}
        - {name: ai-model, serving_endpoint: {name: "${var.ai_model}", permission: CAN_QUERY}}
        - {name: agents-model, serving_endpoint: {name: "${resources.model_serving_endpoints.agents_endpoint.name}", permission: CAN_QUERY}}

targets:
  dev:
    default: true
