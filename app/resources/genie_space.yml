# Generated by deploy/genie_space.py - do not edit by hand. The FR 2052a Genie space (Genie Agent on the UC metric views),
# in the workspace folder /Users/<you>/fr2052a; the app embeds it and calls it (app resource genie-space).
resources:
  genie_spaces:
    fr2052a_genie:
      title: "FR 2052a Liquidity Risk Genie"
      description: "Ask questions about the FR 2052a 6G filing of three reporting entities (the 13 data tables), its validation, the Fed's post-submission checks, reporting runs and sign-off, variance, drill-down to source records, PID derivation and data quality, FR Y-15 STWF, AI suggestions, and the LCR per entity (HQLA, net cash outflows, LCR ratio)."
      warehouse_id: ${var.warehouse_id}
      parent_path: /Workspace/Users/${workspace.current_user.userName}/fr2052a
      serialized_space: "{\"version\": 2, \"config\": {\"sample_questions\": [{\"id\": \"116c901aff415398b98d3b9349ee4c4e\", \"question\": [\"What is the LCR per entity on the latest reporting date and is it compliant?\"]}, {\"id\": \"47d7388a1fd4511dba17620544ac943d\", \"question\": [\"Which Fed post-submission checks are not passing on the latest date?\"]}, {\"id\": \"50bda71a246653b596d4c5c6349927b4\", \"question\": [\"What is the weighted short-term wholesale funding by tier on the latest date?\"]}, {\"id\": \"5d161329c61f53e6b66cdc9e153f8a04\", \"question\": [\"Break down reported outflows by FR 2052a table for each reporting entity on the latest date\"]}, {\"id\": \"7c508366ce615008bca4de2f2eaf9ced\", \"question\": [\"Which movements were outside the ai_forecast range on the latest date?\"]}, {\"id\": \"de49d3fbe4ee5469b22cb559087f3734\", \"question\": [\"Is the latest reporting run ready to sign off, and did the XML pass XSD validation?\"]}]}, \"data_sources\": {\"tables\": [{\"identifier\": \"${var.catalog}.ai_assist.suggestions\"}, {\"identifier\": \"${var.catalog}.audit.gl_reconciliation\"}, {\"identifier\": \"${var.catalog}.audit.intercompany_elimination\"}, {\"identifier\": \"${var.catalog}.audit.pid_derivation_summary\"}, {\"identifier\": \"${var.catalog}.conformed.entity_position\"}, {\"identifier\": \"${var.catalog}.conformed.fact_liquidity_position\"}, {\"identifier\": \"${var.catalog}.dq.assessment_results\"}, {\"identifier\": \"${var.catalog}.dq.feed_monitor\"}, {\"identifier\": \"${var.catalog}.dq.pid_exceptions\"}, {\"identifier\": \"${var.catalog}.reference.ref_collateral\"}, {\"identifier\": \"${var.catalog}.reference.ref_legal_entity\"}, {\"identifier\": \"${var.catalog}.reference.ref_product\"}, {\"identifier\": \"${var.catalog}.reference.ref_reporting_entity\"}, {\"identifier\": \"${var.catalog}.reference.rules_fed_psv\"}, {\"identifier\": \"${var.catalog}.reference.rules_pid_derivation\"}, {\"identifier\": \"${var.catalog}.reg_2052a.adjustments\"}, {\"identifier\": \"${var.catalog}.reg_2052a.fr2052a_check_metrics\"}, {\"identifier\": \"${var.catalog}.reg_2052a.fr2052a_metrics\"}, {\"identifier\": \"${var.catalog}.reg_2052a.gold_validation\"}, {\"identifier\": \"${var.catalog}.reg_2052a.i_a_assets\"}, {\"identifier\": \"${var.catalog}.reg_2052a.o_d_deposits\"}, {\"identifier\": \"${var.catalog}.reg_2052a.o_w_wholesale\"}, {\"identifier\": \"${var.catalog}.reg_2052a.record_lineage\"}, {\"identifier\": \"${var.catalog}.reg_2052a.stwf_schedule_g\"}, {\"identifier\": \"${var.catalog}.reg_2052a.submission_files\"}, {\"identifier\": \"${var.catalog}.reg_2052a.submission_review\"}, {\"identifier\": \"${var.catalog}.reg_2052a.v_filing_records\"}, {\"identifier\": \"${var.catalog}.reg_2052a.variance\"}, {\"identifier\": \"${var.catalog}.reg_lcr.calculation_detail\"}, {\"identifier\": \"${var.catalog}.reg_lcr.calculation_results\"}, {\"identifier\": \"${var.catalog}.reg_lcr.fr2052a_lcr_metrics\"}]}, \"instructions\": {\"text_instructions\": [{\"id\": \"78fe129e924c56bba40643b7212dda6e\", \"content\": [\"SEMANTIC LAYER - use the Unity Catalog metric views first, with MEASURE() and GROUP BY on their dimensions:\\n\", \"- reg_2052a.fr2052a_metrics (one row per reported FR 2052a record): MEASURE(reported_amount_usd_mm), MEASURE(inflows_usd_mm), MEASURE(outflows_usd_mm), MEASURE(inflows_30d_usd_mm), MEASURE(outflows_30d_usd_mm), MEASURE(net_30d_outflows_usd_mm), MEASURE(records), MEASURE(positions), MEASURE(reported_lcr), MEASURE(reported_nsfr); dimensions as_of_date, reporting_entity, entity_name, scope_type, table_code, table_name, flow_side, product_id, product_name, sub_product, counterparty, collateral_class, maturity_bucket, maturity_bucket_order, within_30_days, currency, converted.\\n\", \"- reg_lcr.fr2052a_lcr_metrics (LCR engine, per LCR entity and day): MEASURE(lcr) (a ratio of sums - never average daily ratios), MEASURE(hqla_usd_mm), MEASURE(level1_hqla_usd_mm), MEASURE(level2a_hqla_usd_mm), MEASURE(level2b_hqla_usd_mm), MEASURE(total_outflows_usd_mm), MEASURE(total_inflows_usd_mm), MEASURE(capped_inflows_usd_mm), MEASURE(net_cash_outflows_usd_mm), MEASURE(compliant_days); dimensions as_of_date, entity_id.\\n\", \"- reg_2052a.fr2052a_check_metrics (validation results): MEASURE(checks), MEASURE(checks_passed), MEASURE(checks_failed), MEASURE(warnings), MEASURE(blocking_errors), MEASURE(fed_checks_not_passing), MEASURE(records_failed); dimensions as_of_date, check_source, rule_id, rule_name, table_code, severity, status.\\n\", \"Use the other tables only for record-level detail the metric views do not carry (positions, lineage, run status, variance, AI suggestions, STWF). Never re-derive an amount, LCR or check count that a measure already defines.\\n\", \"This space covers a synthetic US bank holding company (Category I) filing the Federal Reserve FR 2052a Complex Institution Liquidity Monitoring Report in the 6G XML format for three reporting entities in one file: ENT001 Acme Financial Holdings (Consolidated), ENT002 Acme National Bank N.A. (solo), ENT003 Acme Securities LLC (solo broker-dealer). reference.ref_reporting_entity lists them; reference.ref_legal_entity is the legal-entity tree (LE00 parent).\\n\", \"Always filter or group by reporting_entity (entity_id in the LCR and validation tables). When the user names no entity, use ENT001 and say so. Never add the three entities together - the consolidated entity already includes the subsidiaries.\\n\", \"Amounts are in millions of the reported currency; reported_amount_usd in v_filing_records is the USD equivalent. Show amounts with a $ sign, thousands separators and an \\\"M\\\" suffix, e.g. $50,950M.\\n\", \"Reporting dates are the business days 2026-01-02 to 2026-02-27 (as_of_date); month-ends are 2026-01-30 and 2026-02-27. When the user does not give a date, use the latest as_of_date.\\n\", \"FR 2052a tables (table_code): I.A Inflows-Assets, I.U Inflows-Unsecured, I.S Inflows-Secured, I.O Inflows-Other, O.D Outflows-Deposits, O.W Outflows-Wholesale, O.S Outflows-Secured, O.O Outflows-Other, S.DC Derivatives & Collateral, S.L Liquidity Risk Measurement, S.B Balance Sheet, S.I Informational, S.FX Foreign Exchange.\\n\", \"product_id is the FR 2052a product identifier (PID), e.g. 'O.D.1'; join reference.ref_product on product_id for product_name.\\n\", \"reg_2052a.v_filing_records has one row per filed record across all 13 tables with one primary amount; use it for cross-table questions. S.L.6 (LCR) and S.L.10 (NSFR) carry ratios, not amounts - exclude them from sums.\\n\", \"Each filed record (record_key) aggregates positions; reg_2052a.record_lineage maps record_key to the Silver positions and source record_ids (an approved adjustment shows as position_id 'ADJ:<id>'). conformed.entity_position says which Silver positions each reporting entity reports and whether they are EXTERNAL, INTERNAL (with an affiliate outside the entity scope) or SELF (a data error); audit.intercompany_elimination lists positions eliminated inside a scope.\\n\", \"Submission: every generation is a reporting run (run_number) per as_of_date. reg_2052a.submission_files has one row per 6G file (Primary, Reduced at month-end, Comment) and run, with xsd_valid and release_status (BLOCKED or READY_FOR_REVIEW); version is the 6G header version (1 + versions already submitted). reg_2052a.submission_review is the run-control log: GENERATED, REPORTING_REQUESTED, OVERRIDE_REQUESTED, APPROVED, REJECTED, SUBMITTED. The latest status of a run is the row with the latest action_timestamp.\\n\", \"Validation: reg_2052a.gold_validation has one row per check per date; rule_source is '6G BR' (Fed business requirements), '6G BR General', '6G XSD', 'Instructions' (appendix rules) or 'Fed PSV' (the Federal Reserve's 14 post-submission checks, rule_id PSV-01..PSV-14, described in reference.rules_fed_psv); status PASS / FAIL / WARNING / NOT_APPLICABLE.\\n\", \"LCR: reg_lcr.calculation_results has one row per as_of_date and LCR entity (entity_id ENT001, ENT002; the broker-dealer has no standalone LCR); lcr_ratio is a ratio (1.3438 = 134.38%); the minimum is 100%.\\n\", \"Variance: reg_2052a.variance has the day-over-day change per entity x table (series_level TABLE) and top PIDs (PID) with the ai_forecast expected range (lower_usd, upper_usd); is_anomaly marks movements outside it.\\n\", \"FR Y-15: reg_2052a.stwf_schedule_g is the short-term wholesale funding (Schedule G) computed from the FR 2052a data for ENT001, with its FR Y-15 MDRM codes (FR 2052a itself has no MDRM codes - it is identified by product_id); weighted_amount_usd applies the 12 CFR 217.406 weights.\\n\", \"Data quality: dq.feed_monitor is feed completeness per day; dq.assessment_results has one row per DQ rule per date; dq.pid_exceptions lists positions held out of the filing (NO_RULE, or CUSTOMER_PENDING awaiting classification).\\n\", \"AI: ai_assist.suggestions holds proposals from Databricks AI Functions (customer classification, product mapping, PID exception, rule explanation, variance commentary, comment drafts) and the human decision (status PROPOSED / ACCEPTED / REJECTED).\\n\", \"All data is synthetic.\"]}], \"example_question_sqls\": [{\"id\": \"22d3bf0518755433bb39bc1ccdf6bf61\", \"question\": [\"Top counterparties by deposit outflows for ENT001 on the latest date\"], \"sql\": [\"SELECT counterparty, MEASURE(outflows_usd_mm) AS outflows_usd_mm, MEASURE(records) AS records\\n\", \"FROM ${var.catalog}.reg_2052a.fr2052a_metrics\\n\", \"WHERE as_of_date = (SELECT MAX(as_of_date) FROM ${var.catalog}.reg_2052a.v_filing_records) AND reporting_entity = 'ENT001' AND table_code = 'O.D'\\n\", \"GROUP BY ALL ORDER BY outflows_usd_mm DESC LIMIT 10\"], \"usage_guidance\": [\"Counterparty breakdowns of a table.\"]}, {\"id\": \"4696a692f5fd55f392a3122c341d6c1e\", \"question\": [\"What is the status of the latest reporting run?\"], \"sql\": [\"SELECT f.as_of_date, f.run_number, f.version, f.file_type, f.file_name, f.record_count, f.xsd_valid, f.release_status,\\n\", \"       (SELECT MAX_BY(r.status, r.action_timestamp) FROM ${var.catalog}.reg_2052a.submission_review r\\n\", \"        WHERE r.as_of_date = f.as_of_date AND r.run_number = f.run_number) AS run_status\\n\", \"FROM ${var.catalog}.reg_2052a.submission_files f\\n\", \"WHERE f.as_of_date = (SELECT MAX(as_of_date) FROM ${var.catalog}.reg_2052a.submission_files)\\n\", \"  AND f.run_number = (SELECT MAX(run_number) FROM ${var.catalog}.reg_2052a.submission_files x WHERE x.as_of_date = f.as_of_date)\"], \"usage_guidance\": [\"Run status and the 6G files.\"]}, {\"id\": \"578709d7b5e45221939ffbed2173011a\", \"question\": [\"Show the consolidated LCR trend over time\"], \"sql\": [\"SELECT as_of_date, ROUND(MEASURE(lcr) * 100, 2) AS lcr_pct, MEASURE(hqla_usd_mm) AS hqla_usd_mm, MEASURE(net_cash_outflows_usd_mm) AS nco_usd_mm\\n\", \"FROM ${var.catalog}.reg_lcr.fr2052a_lcr_metrics WHERE entity_id = 'ENT001' GROUP BY ALL ORDER BY as_of_date\"], \"usage_guidance\": [\"LCR / HQLA / net cash outflow trends; filter one entity.\"]}, {\"id\": \"626747c1ceac56f687eaaaec37863d7b\", \"question\": [\"What are the 30-day outflows and inflows by entity on the latest date?\"], \"sql\": [\"SELECT reporting_entity, MEASURE(outflows_30d_usd_mm) AS outflows_30d, MEASURE(inflows_30d_usd_mm) AS inflows_30d, MEASURE(net_30d_outflows_usd_mm) AS net_30d\\n\", \"FROM ${var.catalog}.reg_2052a.fr2052a_metrics WHERE as_of_date = (SELECT MAX(as_of_date) FROM ${var.catalog}.reg_2052a.v_filing_records) GROUP BY ALL ORDER BY 1\"], \"usage_guidance\": [\"Unweighted 30-day maturity flows; the weighted view is the LCR.\"]}, {\"id\": \"6a96fe6500a35945a18fe69f76db13b2\", \"question\": [\"What is the LCR per entity on the latest reporting date?\"], \"sql\": [\"SELECT as_of_date, entity_id, ROUND(MEASURE(lcr) * 100, 2) AS lcr_pct, MEASURE(hqla_usd_mm) AS hqla_usd_mm, MEASURE(net_cash_outflows_usd_mm) AS nco_usd_mm\\n\", \"FROM ${var.catalog}.reg_lcr.fr2052a_lcr_metrics\\n\", \"WHERE as_of_date = (SELECT MAX(as_of_date) FROM ${var.catalog}.reg_lcr.calculation_results)\\n\", \"GROUP BY ALL ORDER BY entity_id\"], \"usage_guidance\": [\"LCR questions: use the LCR metric view; one row per LCR entity.\"]}, {\"id\": \"8c9298c9d5315e9381faefed4e46b361\", \"question\": [\"How many checks failed or warned on the latest date, by source?\"], \"sql\": [\"SELECT check_source, MEASURE(checks) AS checks, MEASURE(checks_failed) AS failed, MEASURE(warnings) AS warnings, MEASURE(blocking_errors) AS blocking\\n\", \"FROM ${var.catalog}.reg_2052a.fr2052a_check_metrics WHERE as_of_date = (SELECT MAX(as_of_date) FROM ${var.catalog}.reg_2052a.gold_validation) GROUP BY ALL ORDER BY 1\"], \"usage_guidance\": [\"Validation summaries: use the check metric view.\"]}, {\"id\": \"8d14d3d6430f5c0d94d3be5641eeb8bf\", \"question\": [\"Which checks did not pass on the latest date?\"], \"sql\": [\"SELECT rule_id, rule_source, table_code, rule_name, severity, status, records_failed, failure_details\\n\", \"FROM ${var.catalog}.reg_2052a.gold_validation\\n\", \"WHERE as_of_date = (SELECT MAX(as_of_date) FROM ${var.catalog}.reg_2052a.gold_validation) AND status IN ('FAIL', 'WARNING')\\n\", \"ORDER BY status, rule_id\"], \"usage_guidance\": [\"Detail of the checks that did not pass (the failure text is on gold_validation).\"]}, {\"id\": \"b58b5f9789a3592c816b3cff9f095d7b\", \"question\": [\"Which movements were outside the expected range on the latest date?\"], \"sql\": [\"SELECT reporting_entity, series_level, table_code, product_id, prior_amount_usd, amount_usd, ROUND(change_pct, 1) AS change_pct, lower_usd, upper_usd\\n\", \"FROM ${var.catalog}.reg_2052a.variance\\n\", \"WHERE as_of_date = (SELECT MAX(as_of_date) FROM ${var.catalog}.reg_2052a.variance) AND is_anomaly\\n\", \"ORDER BY ABS(amount_usd - prior_amount_usd) DESC\"], \"usage_guidance\": [\"Variance / anomaly questions; the range comes from ai_forecast.\"]}, {\"id\": \"c1d28c54a97a52638c7b8120b7e20779\", \"question\": [\"Break down outflows by FR 2052a table and entity for the latest date\"], \"sql\": [\"SELECT reporting_entity, table_code, table_name, MEASURE(outflows_usd_mm) AS outflows_usd_mm, MEASURE(records) AS records, MEASURE(positions) AS positions\\n\", \"FROM ${var.catalog}.reg_2052a.fr2052a_metrics\\n\", \"WHERE as_of_date = (SELECT MAX(as_of_date) FROM ${var.catalog}.reg_2052a.v_filing_records) AND flow_side = 'Outflow'\\n\", \"GROUP BY ALL ORDER BY reporting_entity, outflows_usd_mm DESC\"], \"usage_guidance\": [\"Table-level breakdowns: use the FR 2052a metric view; keep entities separate.\"]}, {\"id\": \"da6da654b953554cb5056ba8ea827d9f\", \"question\": [\"Top products by reported amount for the consolidated entity on the latest date\"], \"sql\": [\"SELECT table_code, product_id, product_name, MEASURE(reported_amount_usd_mm) AS usd_mm\\n\", \"FROM ${var.catalog}.reg_2052a.fr2052a_metrics\\n\", \"WHERE as_of_date = (SELECT MAX(as_of_date) FROM ${var.catalog}.reg_2052a.v_filing_records) AND reporting_entity = 'ENT001'\\n\", \"GROUP BY ALL ORDER BY usd_mm DESC LIMIT 10\"], \"usage_guidance\": [\"Product (PID) questions across tables.\"]}]}, \"benchmarks\": {\"questions\": [{\"id\": \"3e0725ac64295d19899fc5135d3cf42c\", \"question\": [\"What is the LCR of ENT001 on 2026-02-27?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT ROUND(MEASURE(lcr) * 100, 2) AS lcr_pct FROM ${var.catalog}.reg_lcr.fr2052a_lcr_metrics WHERE entity_id = 'ENT001' AND as_of_date = '2026-02-27'\"]}]}, {\"id\": \"6bff0f29635852eda470e86e90ff1c5f\", \"question\": [\"Net 30-day outflows for ENT002 on 2026-02-27\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT MEASURE(net_30d_outflows_usd_mm) AS net_30d_outflows_usd_mm FROM ${var.catalog}.reg_2052a.fr2052a_metrics WHERE reporting_entity = 'ENT002' AND as_of_date = '2026-02-27'\"]}]}, {\"id\": \"7cd6862ab62f5aa1ac80dae72a7cdb7e\", \"question\": [\"How many FR 2052a records did each reporting entity report on 2026-02-27?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT reporting_entity, MEASURE(records) AS records FROM ${var.catalog}.reg_2052a.fr2052a_metrics WHERE as_of_date = '2026-02-27' GROUP BY ALL ORDER BY 1\"]}]}, {\"id\": \"830afd20e2eb5934a0583a77eb8160c5\", \"question\": [\"Which Fed post-submission checks did not pass on 2026-02-27?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT rule_id, rule_name, status FROM ${var.catalog}.reg_2052a.gold_validation WHERE as_of_date = '2026-02-27' AND rule_source = 'Fed PSV' AND status <> 'PASS' ORDER BY rule_id\"]}]}, {\"id\": \"b825aae8d43b5df5b0ae4b8a7f99381b\", \"question\": [\"Total deposit outflows (O.D) for ENT001 on 2026-02-27 in USD millions\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT MEASURE(outflows_usd_mm) AS outflows_usd_mm FROM ${var.catalog}.reg_2052a.fr2052a_metrics WHERE reporting_entity = 'ENT001' AND as_of_date = '2026-02-27' AND table_code = 'O.D'\"]}]}, {\"id\": \"c8077779d5f45345a2b17333d0ca5c0a\", \"question\": [\"Top 5 counterparties by O.D outflows for ENT001 on 2026-02-27\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT counterparty, MEASURE(outflows_usd_mm) AS outflows_usd_mm FROM ${var.catalog}.reg_2052a.fr2052a_metrics WHERE reporting_entity = 'ENT001' AND as_of_date = '2026-02-27' AND table_code = 'O.D' GROUP BY ALL ORDER BY 2 DESC LIMIT 5\"]}]}, {\"id\": \"e1077a24d5b7581a9f8aec3ee493bfe1\", \"question\": [\"What is the LCR of the bank ENT002 on 2026-02-27?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT ROUND(MEASURE(lcr) * 100, 2) AS lcr_pct FROM ${var.catalog}.reg_lcr.fr2052a_lcr_metrics WHERE entity_id = 'ENT002' AND as_of_date = '2026-02-27'\"]}]}, {\"id\": \"e781d5de46c45962a18756535159452b\", \"question\": [\"How many blocking errors and warnings were there on 2026-02-27?\"], \"answer\": [{\"format\": \"SQL\", \"content\": [\"SELECT MEASURE(blocking_errors) AS blocking_errors, MEASURE(warnings) AS warnings FROM ${var.catalog}.reg_2052a.fr2052a_check_metrics WHERE as_of_date = '2026-02-27'\"]}]}]}}"
