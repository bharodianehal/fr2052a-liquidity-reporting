# The AI/BI dashboards (generated by deploy/dashboard.py, catalog-free); published with embed credentials for the app.
resources:
  dashboards:
    fr2052a_liquidity_reporting:
      display_name: FR 2052a Liquidity Reporting
      file_path: ../dashboards/fr2052a_liquidity_reporting.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      embed_credentials: true
    fr2052a_lcr:
      display_name: FR 2052a LCR
      file_path: ../dashboards/fr2052a_lcr.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      embed_credentials: true
